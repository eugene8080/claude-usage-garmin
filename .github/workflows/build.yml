name: Build APK

# Every push that touches the Android app builds an installable APK and attaches
# it to the run, so the app can be updated without an Android SDK on the machine
# doing the updating. Pushing a v* tag also publishes that APK to Releases under
# a stable name, which is what the README's download button points at.
#
# The path filters skip commits that only touch garmin/ or docs (the Connect IQ
# projects are built locally - the developer key never goes to CI). They do not
# gate releases: GitHub does not evaluate path filters on tag pushes, so every
# v* tag still builds and publishes, and "Run workflow" always runs. The
# phone <-> watch contract is checked on every change by contract.yml instead.
# (Listed twice because push and pull_request each need their own copy.)
on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release under this tag, e.g. v1.1. Leave empty to only build.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on a v* tag

    env:
      # Optional. Set all four repository secrets to get a release-signed APK
      # on tags; without them the workflow still produces a debug-signed one,
      # which sideloads fine and needs no keystore to manage. See the README.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is derived from the commit count

      # A release comes either from a pushed v* tag or from the tag typed into
      # "Run workflow", so a release can be cut from the Actions tab alone.
      - name: Work out whether this run publishes a release
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          if [ -n "$tag" ]; then echo "Publishing as $tag"; else echo "Build only"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK but not necessarily this
      # platform, and an implicit download is easy to misread when it fails.
      - name: Install Android SDK platform 36
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # app/build.gradle.kts picks up release signing from this gitignored
      # file when it exists, and quietly builds unsigned when it doesn't.
      - name: Restore the signing config
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p .signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > .signing/release.keystore
          cat > .signing/keystore.properties <<EOF
          storeFile=.signing/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Same derivation release.sh uses: the tag is the versionName, and the
      # commit count is a versionCode that always increases. Without this every
      # CI release would ship versionCode 3 and refuse to install over itself.
      - name: Stamp the version from the release tag
        if: env.RELEASE_TAG != ''
        run: |
          version="${RELEASE_TAG#v}"
          code="$(git rev-list --count HEAD)"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${code}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${version}\"/" app/build.gradle.kts
          echo "Building ${version} (versionCode ${code})"

      - name: Build the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Without a keystore assembleRelease only yields app-release-unsigned.apk,
      # which won't install — so it's only worth building when signing is set up.
      - name: Build the release APK
        if: env.RELEASE_TAG != '' && env.KEYSTORE_B64 != ''
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload the APK to this run
        uses: actions/upload-artifact@v4
        with:
          # On a pull_request, github.sha is the ephemeral merge commit, which
          # appears nowhere in the PR — name the APK after the commit you can see.
          name: claude-usage-widget-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Stage the release asset
        if: env.RELEASE_TAG != ''
        id: asset
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            cp app/build/outputs/apk/release/app-release.apk claude-usage-widget.apk
            echo "signing=the release key" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk claude-usage-widget.apk
            echo "signing=the debug key (no signing secrets configured)" >> "$GITHUB_OUTPUT"
          fi
          # Two copies of the same APK: the stable name is what the README's
          # releases/latest/download button resolves to, and the versioned name lets a
          # downloaded file identify its release on sight (claude-usage-widget-v1.7.apk).
          cp claude-usage-widget.apk "claude-usage-widget-${RELEASE_TAG}.apk"

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ steps.asset.outputs.signing }}
        run: |
          tag="$RELEASE_TAG"
          # gh creates the tag at this commit when it doesn't exist, so no tag has to
          # be pushed from a checkout; re-running against an existing one just replaces
          # the asset rather than failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" claude-usage-widget.apk "claude-usage-widget-${tag}.apk" --clobber
          else
            gh release create "$tag" claude-usage-widget.apk "claude-usage-widget-${tag}.apk" \
              --title "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
          gh release edit "$tag" --notes "$(gh release view "$tag" --json body --jq .body)

          ---
          Built by CI from \`${GITHUB_SHA}\`, signed with ${SIGNING}. Installing over an
          APK signed with a different key needs an uninstall first, which clears the
          stored session and means signing in to Claude again."
